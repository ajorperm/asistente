<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d4a3f">
    <meta name="description" content="Asistente personal - Captura ideas, organiza tu vida">
    <title>Asistente - Personal</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232d4a3f' width='180' height='180'/><text x='50%' y='50%' font-size='90' font-weight='bold' fill='%23e8dcc8' text-anchor='middle' dominant-baseline='middle' font-family='serif'>A</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%232d4a3f' width='180' height='180'/><text x='50%' y='50%' font-size='90' font-weight='bold' fill='%23e8dcc8' text-anchor='middle' dominant-baseline='middle' font-family='serif'>A</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --beige: #f5f1ed;
            --beige-dark: #e8dcc8;
            --brown: #8b7355;
            --brown-light: #a89070;
            --green-dark: #2d4a3f;
            --green-medium: #3d5a4f;
            --accent-gold: #d4a574;
            --text-dark: #2d2d2d;
            --text-light: #666;
            --border: #e0d5ca;
            --success: #5a8f6f;
            --error: #c85a5a;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--beige);
            color: var(--text-dark);
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            background: var(--green-dark);
            color: var(--beige);
            padding: 1.5rem;
            padding-top: max(1.5rem, env(safe-area-inset-top));
            padding-left: max(1.5rem, env(safe-area-inset-left));
            padding-right: max(1.5rem, env(safe-area-inset-right));
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.85;
            font-weight: 300;
        }

        /* NAVIGATION TABS */
        .nav-tabs {
            display: flex;
            background: var(--beige);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            gap: 0;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        .nav-tabs button {
            flex: 1;
            min-width: 80px;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-tabs button.active {
            color: var(--green-dark);
            border-bottom-color: var(--green-dark);
            background: rgba(45, 74, 63, 0.03);
        }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            padding-left: max(1.5rem, env(safe-area-inset-left));
            padding-right: max(1.5rem, env(safe-area-inset-right));
            padding-bottom: max(100px, calc(1.5rem + env(safe-area-inset-bottom)));
            -webkit-overflow-scrolling: touch;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .view-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .view-subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* ITEMS LIST */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .item:active {
            background: var(--beige);
        }

        .item-checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 2px solid var(--border);
            border-radius: 4px;
            margin-top: 2px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
        }

        .item.completed .item-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            word-break: break-word;
        }

        .item.completed .item-title {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .item-meta {
            display: flex;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
            flex-wrap: wrap;
        }

        .item-date {
            background: rgba(212, 165, 116, 0.1);
            color: var(--brown);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .item-project {
            background: rgba(45, 74, 63, 0.08);
            color: var(--green-dark);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .item:hover .item-actions,
        .item:active .item-actions {
            opacity: 1;
        }

        .item-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--beige-dark);
            color: var(--text-dark);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .item-btn:active {
            background: var(--border);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-light);
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        /* CAPTURE AREA */
        .capture-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--green-dark);
            padding: 1rem;
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            display: flex;
            gap: 0.75rem;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 100;
            flex-shrink: 0;
        }

        .capture-input {
            flex: 1;
            border: none;
            border-radius: 24px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            background: var(--beige);
            color: var(--text-dark);
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .capture-input:focus {
            box-shadow: 0 0 0 2px rgba(212, 165, 116, 0.3);
        }

        .capture-input::placeholder {
            color: var(--text-light);
        }

        /* BUTTONS */
        .btn {
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--brown);
            color: white;
        }

        .btn-primary:active {
            background: var(--brown-light);
        }

        .btn-mic {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: var(--text-dark);
            padding: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: pulse 2s infinite;
        }

        .btn-mic.recording {
            animation: none;
            background: #ff6b6b;
            color: white;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-send {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: var(--text-dark);
            padding: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-send:active {
            background: var(--brown);
            color: white;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            align-items: flex-end;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--beige);
            width: 100%;
            max-width: 100%;
            border-radius: 16px 16px 0 0;
            padding: 1.5rem;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            background: white;
            color: var(--text-dark);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* STATUS */
        .status {
            position: fixed;
            bottom: 100px;
            left: 1rem;
            right: 1rem;
            background: var(--success);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            animation: slideUp 0.3s ease-out;
            z-index: 150;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* RESPONSIVE */
        @media (min-width: 768px) {
            .main {
                max-width: 800px;
                margin: 0 auto;
                padding: 2rem;
                padding-bottom: max(150px, calc(2rem + env(safe-area-inset-bottom)));
            }

            .item-actions {
                opacity: 1;
            }

            .capture-area {
                max-width: 800px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 16px 16px 0 0;
                width: calc(100% - 2rem);
            }
        }

        /* DARK MODE SUPPORT */
        @media (prefers-color-scheme: dark) {
            :root {
                --beige: #1a1815;
                --beige-dark: #2d2620;
                --brown: #b89968;
                --brown-light: #a89070;
                --green-dark: #3d5a4f;
                --text-dark: #e8e3dd;
                --text-light: #9a9490;
                --border: #3a3530;
            }

            .item {
                background: #252220;
            }

            .capture-input {
                background: #2d2620;
                color: var(--text-dark);
            }

            .modal-content {
                background: #2d2620;
            }

            .form-input, .form-textarea, .form-select {
                background: #1a1815;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Asistente</h1>
            <p>Captura. Organiza. Ejecuta.</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" data-view="hoy">HOY</button>
            <button class="nav-btn" data-view="proximos">PRÓXIMOS</button>
            <button class="nav-btn" data-view="inbox">POR ORDENAR</button>
            <button class="nav-btn" data-view="proyectos">PROYECTOS</button>
            <button class="nav-btn" data-view="completados">COMPLETADOS</button>
        </div>

        <div class="main">
            <!-- HOY -->
            <div id="hoy" class="view active">
                <h2 class="view-title">Hoy</h2>
                <p class="view-subtitle">¿Qué tienes que hacer?</p>
                <div id="hoy-items" class="items-list"></div>
            </div>

            <!-- PRÓXIMOS -->
            <div id="proximos" class="view">
                <h2 class="view-title">Próximos</h2>
                <p class="view-subtitle">Los próximos días</p>
                <div id="proximos-items" class="items-list"></div>
            </div>

            <!-- POR ORDENAR -->
            <div id="inbox" class="view">
                <h2 class="view-title">Por ordenar</h2>
                <p class="view-subtitle">Sin fecha asignada</p>
                <div id="inbox-items" class="items-list"></div>
            </div>

            <!-- PROYECTOS -->
            <div id="proyectos" class="view">
                <h2 class="view-title">Proyectos</h2>
                <p class="view-subtitle">Tus áreas activas</p>
                <div id="proyectos-items" class="items-list"></div>
            </div>

            <!-- COMPLETADOS -->
            <div id="completados" class="view">
                <h2 class="view-title">Completados</h2>
                <p class="view-subtitle">Tu progreso</p>
                <div id="completados-items" class="items-list"></div>
            </div>
        </div>

        <!-- CAPTURE AREA -->
        <div class="capture-area">
            <button class="btn-mic" id="mic-btn" title="Grabar por voz">🎤</button>
            <input
                type="text"
                class="capture-input"
                id="capture-input"
                placeholder="Di o escribe cualquier cosa..."
                autocomplete="off"
            >
            <button class="btn-send" id="send-btn" title="Enviar">→</button>
        </div>
    </div>

    <!-- MODAL EDIT -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>

            <form id="edit-form">
                <div class="form-group">
                    <label class="form-label">Qué necesitas hacer</label>
                    <textarea class="form-textarea" id="edit-title" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Cuándo</label>
                    <select class="form-select" id="edit-when">
                        <option value="">Sin fecha</option>
                        <option value="hoy">Hoy</option>
                        <option value="manana">Mañana</option>
                        <option value="esta-semana">Esta semana</option>
                        <option value="proxima-semana">Próxima semana</option>
                        <option value="algún-día">Algún día</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Proyecto</label>
                    <input type="text" class="form-input" id="edit-project" placeholder="Ej: Costa Rica, EMCA, Casa...">
                </div>

                <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar</button>
                    <button type="button" class="btn" id="delete-btn" style="flex: 1; background: var(--error); color: white;">Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

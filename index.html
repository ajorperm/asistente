<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Asistente</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asistente">
<meta name="theme-color" content="#F7F4EF">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#F6F2EC; --surface:#FFFDF9; --surface2:#FCF8F2;
  --ink:#2C2723; --ink2:#5A5049; --muted:#948A80;
  --line:#E8E0D5; --line2:#F0EAE0;
  --accent:#2E4A3B; --accent-soft:#E4EAE4;
  --warm:#A8825C; --urgent:#A3563F;
  --radius:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(178px + var(--safe-b));
  overscroll-behavior-y:contain;
}
.serif{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif}

/* ---------- cabecera ---------- */
header{padding:calc(28px + var(--safe-t)) 22px 10px}
h1{margin:0;font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:14px;margin-top:6px;letter-spacing:.2px}

/* ---------- secciones ---------- */
main{padding:0 22px}
section{margin:26px 0 0}
.shead{
  display:flex;align-items:baseline;justify-content:space-between;
  font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 10px 2px;
}
.shead .n{font-weight:400;letter-spacing:.5px}

/* ---------- item ---------- */
.item{
  display:flex;gap:13px;align-items:flex-start;
  background:var(--surface);border-radius:var(--radius);
  padding:14px 15px;margin-bottom:8px;
  border:1px solid var(--line2);
  transition:opacity .2s,transform .1s;
}
.item:active{transform:scale(.994)}
.item.done{opacity:.4}
.tick{
  flex:0 0 22px;height:22px;margin-top:1px;border-radius:50%;
  border:1.6px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;padding:0;
}
.tick:active{border-color:var(--accent)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.tick.on svg{opacity:1}
.tick.ev{border-radius:5px}
.body{flex:1;min-width:0;cursor:pointer}
.ttl{font-size:16px;line-height:1.35;letter-spacing:-.1px}
.done .ttl{text-decoration:line-through}
.meta{margin-top:5px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.meta .proj{color:var(--warm)}
.meta .hot{color:var(--urgent);font-weight:600}
.meta .type{color:var(--accent)}
.empty{color:var(--muted);font-size:14.5px;padding:14px 4px;line-height:1.6}

/* ---------- proyectos ---------- */
.pcard{
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);
  padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;
}
.pcard .pn{font-size:17px;letter-spacing:-.2px}
.pcard .pc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- calendario ---------- */
.cal{background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);padding:14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calhead b{font-weight:500;font-size:17px;text-transform:capitalize}
.calhead button{background:none;border:0;font-size:20px;color:var(--ink2);padding:4px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.6px}
.day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:9px;font-size:14px;cursor:pointer;color:var(--ink2);position:relative;
  font-variant-numeric:tabular-nums;
}
.day.out{color:#CFC6BA}
.day.today{background:var(--accent-soft);color:var(--accent);font-weight:600}
.day.sel{background:var(--accent);color:#fff}
.dot{width:4px;height:4px;border-radius:50%;background:var(--warm);position:absolute;bottom:5px}
.day.sel .dot{background:#fff}

/* ---------- barra de captura ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(to bottom,rgba(246,242,236,0) 0%,var(--bg) 22%);
  padding:16px 16px calc(8px + var(--safe-b));
}
.cap{
  display:flex;gap:9px;align-items:center;
  background:var(--surface);border:1px solid var(--line);
  border-radius:26px;padding:6px 6px 6px 18px;
  box-shadow:0 3px 16px rgba(60,45,30,.07);
}
.cap input{
  flex:1;border:0;background:none;font-size:16.5px;color:var(--ink);
  padding:11px 0;outline:none;font-family:inherit;min-width:0;
}
.cap input::placeholder{color:#B5ABA0}
.rb{
  flex:0 0 40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;background:var(--accent);
}
.rb svg{width:19px;height:19px;fill:#fff}
.rb.rec{background:var(--urgent);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

nav{
  display:flex;justify-content:space-around;align-items:center;
  margin-top:12px;padding-top:2px;
}
nav button{
  background:none;border:0;padding:6px 12px;cursor:pointer;
  color:var(--muted);font-size:11px;letter-spacing:.3px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:inherit;
}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:600}

/* ---------- ficha ---------- */
.scrim{position:fixed;inset:0;background:rgba(40,32,24,.34);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px 22px calc(26px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 18px}
.f{margin-bottom:16px}
.f label{display:block;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:600}
.f input,.f select,.f textarea{
  width:100%;border:1px solid var(--line);background:var(--surface2);
  border-radius:11px;padding:12px 13px;font-size:16px;color:var(--ink);
  font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;
}
.f textarea{resize:none;line-height:1.5}
.f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23948A80' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:36px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.orig{font-size:13.5px;color:var(--muted);line-height:1.6;background:var(--surface2);border-radius:11px;padding:12px 13px;border:1px solid var(--line2)}
.acts{display:flex;gap:9px;margin-top:22px}
.btn{
  flex:1;padding:15px;border-radius:13px;border:0;font-size:15.5px;
  font-family:inherit;font-weight:500;cursor:pointer;
}
.btn.p{background:var(--accent);color:#fff}
.btn.s{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.btn.d{background:none;color:var(--urgent);border:1px solid var(--line);flex:0 0 54px;font-size:18px}

/* ---------- avisos ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(160px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--ink);color:#F6F2EC;padding:12px 20px;border-radius:24px;
  font-size:14.5px;z-index:60;opacity:0;pointer-events:none;transition:.24s;
  max-width:calc(100% - 44px);text-align:center;line-height:1.4;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.5;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1 class="serif" id="greet">Hola</h1>
  <div class="sub" id="today"></div>
</header>

<main id="main"></main>

<div class="dock">
  <div class="cap">
    <input id="cin" placeholder="Capturar…" autocomplete="off" autocorrect="on" enterkeyhint="done">
    <button class="rb" id="rb" aria-label="Dictar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2z"/></svg>
    </button>
  </div>
  <nav id="nav">
    <button data-v="hoy" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button data-v="inbox"><svg viewBox="0 0 24 24"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 5h14l1 8v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/></svg>Ordenar</button>
    <button data-v="proj"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Proyectos</button>
    <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button data-v="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Buscar</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var API = 'https://qwgmsqtzttnxcbgwenxx.supabase.co/functions/v1/asistente';
var KEY = new URLSearchParams(location.search).get('k') || 'spynT3xtJcowSARF86TqCsVsmg3q2FHT';

// La app anterior dejó un service worker que serviría la versión vieja
// desde la caché. Lo retiramos para que esto no se quede congelado.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){ r.unregister(); });
  }).catch(function(){});
}
if (window.caches && caches.keys) {
  caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
}

var S = { items: [], view: 'hoy', proj: null, calM: null, q: '' };

var MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var TIPO = { task:'Tarea', reminder:'Recordatorio', event:'Evento', idea:'Idea', note:'Nota' };
var FRANJA = { morning:'por la mañana', midday:'a mediodía', afternoon:'por la tarde', evening:'por la tarde', night:'por la noche' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

var tt;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

function api(method, qs, body){
  var url = API + '?k=' + encodeURIComponent(KEY) + (qs || '');
  var o = { method: method, headers: {} };
  if (body){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  return fetch(url, o).then(function(r){ return r.json(); });
}

function load(){
  return api('GET','').then(function(d){
    S.items = (d && d.items) ? d.items : [];
  }).catch(function(){
    toast('Sin conexión. Reintentando al volver.');
  });
}

/* ---------- fechas legibles ---------- */
function cuando(it){
  if (it.when_label) {
    var s = it.when_label;
    if (it.when_time) s += ' a las ' + hhmm(it.when_time);
    else if (it.when_daypart && s.indexOf('por la') < 0 && s.indexOf('mediodía') < 0) s += ' ' + FRANJA[it.when_daypart];
    return s;
  }
  if (it.when_date) {
    var s2 = fechaCorta(it.when_date);
    if (it.when_time) s2 += ' a las ' + hhmm(it.when_time);
    return s2;
  }
  return '';
}
function hhmm(t){ var s = String(t).slice(0,5).replace(/^0/,''); return s.slice(-3) === ':00' ? s.slice(0,-3) : s; }
function fechaCorta(iso){
  var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  var h = new Date(); h.setHours(0,0,0,0);
  var diff = Math.round((d - h) / 86400000);
  if (diff === 0) return 'hoy';
  if (diff === 1) return 'mañana';
  if (diff === -1) return 'ayer';
  if (diff < 0) return 'hace ' + (-diff) + ' días';
  if (diff < 7) return DIA[d.getDay()];
  return d.getDate() + ' ' + MES[d.getMonth()].slice(0,3);
}

/* ---------- clasificación de HOY ---------- */
function cubo(it){
  var h = hoyISO();
  if (it.when_kind === 'someday') return 'algun';
  if (it.when_date && it.when_date < h) return 'ahora';         // atrasado
  if (it.when_date === h) {
    if (it.when_time) {
      var now = new Date().getHours()*60 + new Date().getMinutes();
      var p = String(it.when_time).split(':');
      var mm = (+p[0])*60 + (+p[1]);
      return (mm - now <= 90) ? 'ahora' : 'hoy';
    }
    if (it.when_daypart === 'night' || it.when_daypart === 'evening') return 'tarde';
    return 'hoy';
  }
  if (it.when_kind === 'period' && it.when_date <= h && (!it.when_end_date || it.when_end_date >= h)) return 'hoy';
  if (it.when_date && it.when_date > h) return null;            // futuro: no es hoy
  return 'algun';                                               // sin fecha
}

/* ---------- render ---------- */
function render(){
  var h = new Date().getHours();
  $('greet').textContent = h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
  var d = new Date();
  $('today').textContent = DIA[d.getDay()] + ', ' + d.getDate() + ' de ' + MES[d.getMonth()];

  var b = document.querySelectorAll('#nav button');
  for (var i=0;i<b.length;i++) b[i].classList.toggle('on', b[i].dataset.v === S.view);

  var m = $('main');
  if (S.view === 'hoy') m.innerHTML = vHoy();
  else if (S.view === 'inbox') m.innerHTML = vInbox();
  else if (S.view === 'proj') m.innerHTML = S.proj ? vProyecto() : vProyectos();
  else if (S.view === 'cal') m.innerHTML = vCal();
  else m.innerHTML = vBuscar();

  if (S.view === 'buscar') {
    var qi = $('qin');
    if (qi) { qi.value = S.q; qi.oninput = function(){ S.q = this.value; var r=$('qres'); if(r) r.innerHTML = listaHTML(buscar(), 'Nada por aquí.'); }; }
  }
}

function grupo(t, arr, n){
  if (!arr.length) return '';
  return '<section><div class="shead"><span>' + t + '</span><span class="n">' + arr.length + '</span></div>' + arr.map(itemHTML).join('') + '</section>';
}

function vHoy(){
  var buckets = { ahora:[], hoy:[], tarde:[], algun:[] };
  S.items.forEach(function(it){ var c = cubo(it); if (c) buckets[c].push(it); });

  ['ahora','hoy','tarde'].forEach(function(k){
    buckets[k].sort(function(a,b){ return (a.when_time||'99') < (b.when_time||'99') ? -1 : 1; });
  });
  buckets.algun.sort(function(a,b){
    var r = { urgent:0, important:1, normal:2 };
    return r[a.priority] - r[b.priority];
  });
  var extra = buckets.algun.slice(0, 6);

  var out = grupo('Ahora', buckets.ahora) + grupo('Hoy', buckets.hoy) + grupo('Más tarde', buckets.tarde) + grupo('Si tengo tiempo', extra);

  if (!out) {
    out = '<section><div class="empty">Hoy no tienes nada marcado.<br>Todo lo que captures aparecerá aquí cuando toque.</div></section>';
  }
  return out;
}

function vInbox(){
  var arr = S.items.filter(function(it){ return !it.project; });
  return '<section><div class="shead"><span>Por ordenar</span><span class="n">' + arr.length + '</span></div>' +
    (arr.length ? arr.map(itemHTML).join('') : '<div class="empty">Bandeja vacía. Bien hecho.</div>') + '</section>';
}

function vProyectos(){
  var map = {};
  S.items.forEach(function(it){ if (it.project) map[it.project] = (map[it.project]||0) + 1; });
  var names = Object.keys(map).sort();
  var sin = S.items.filter(function(it){ return !it.project; }).length;

  var html = '<section><div class="shead"><span>Proyectos</span><span class="n">' + names.length + '</span></div>';
  if (!names.length) html += '<div class="empty">Todavía no hay proyectos.<br>Se crean solos cuando nombras uno al capturar, o desde la ficha de cualquier elemento.</div>';
  names.forEach(function(n){
    html += '<div class="pcard" onclick="A.abrirProy(' + JSON.stringify(n).replace(/"/g,'&quot;') + ')"><span class="pn">' + esc(n) + '</span><span class="pc">' + map[n] + '</span></div>';
  });
  if (sin) html += '<div class="pcard" onclick="A.ir(\'inbox\')"><span class="pn" style="color:var(--muted)">Sin proyecto</span><span class="pc">' + sin + '</span></div>';
  return html + '</section>';
}

function vProyecto(){
  var arr = S.items.filter(function(it){ return it.project === S.proj; });
  var acc = arr.filter(function(i){ return (i.type==='task'||i.type==='reminder') && i.when_date; });
  var pend = arr.filter(function(i){ return (i.type==='task'||i.type==='reminder') && !i.when_date; });
  var ev = arr.filter(function(i){ return i.type==='event'; });
  var notas = arr.filter(function(i){ return i.type==='idea' || i.type==='note'; });

  return '<section><div class="shead"><span onclick="A.ir(\'proj\')" style="cursor:pointer">‹ Proyectos</span><span class="n">' + arr.length + '</span></div>' +
    '<h1 class="serif" style="font-size:25px;margin:0 0 4px">' + esc(S.proj) + '</h1></section>' +
    grupo('Próximas acciones', acc) + grupo('Pendientes', pend) + grupo('Citas y fechas', ev) + grupo('Ideas y notas', notas) +
    (arr.length ? '' : '<section><div class="empty">Nada guardado todavía en este proyecto.</div></section>');
}

function vCal(){
  var base = S.calM ? new Date(S.calM) : new Date();
  var y = base.getFullYear(), mo = base.getMonth();
  var first = new Date(y, mo, 1);
  var start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));

  var conFecha = {};
  S.items.forEach(function(it){ if (it.when_date) conFecha[it.when_date] = true; });

  var h = '<section><div class="cal"><div class="calhead">' +
    '<button onclick="A.mes(-1)">‹</button><b>' + MES[mo] + ' ' + y + '</b><button onclick="A.mes(1)">›</button></div><div class="grid">';
  ['L','M','X','J','V','S','D'].forEach(function(d){ h += '<div class="dow">' + d + '</div>'; });

  var t = hoyISO();
  for (var i = 0; i < 42; i++){
    var d = new Date(start); d.setDate(start.getDate() + i);
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    var cls = 'day' + (d.getMonth() !== mo ? ' out' : '') + (iso === t ? ' today' : '') + (iso === S.selDay ? ' sel' : '');
    h += '<div class="' + cls + '" onclick="A.dia(\'' + iso + '\')">' + d.getDate() + (conFecha[iso] ? '<span class="dot"></span>' : '') + '</div>';
  }
  h += '</div></div></section>';

  if (S.selDay){
    var arr = S.items.filter(function(it){
      if (it.when_date === S.selDay) return true;
      return it.when_kind === 'period' && it.when_date <= S.selDay && it.when_end_date >= S.selDay;
    });
    h += '<section><div class="shead"><span>' + fechaLarga(S.selDay) + '</span><span class="n">' + arr.length + '</span></div>' +
      (arr.length ? arr.map(itemHTML).join('') : '<div class="empty">Nada este día.</div>') + '</section>';
  }
  return h;
}
function fechaLarga(iso){ var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]); return DIA[d.getDay()] + ' ' + d.getDate() + ' de ' + MES[d.getMonth()]; }

function vBuscar(){
  return '<section><div class="f"><input id="qin" placeholder="Buscar en todo…" autocomplete="off"></div>' +
    '<div id="qres">' + listaHTML(buscar(), 'Escribe para buscar entre tareas, notas, ideas y proyectos.') + '</div></section>';
}
function buscar(){
  var q = S.q.trim().toLowerCase();
  if (!q) return [];
  return S.items.filter(function(it){
    return (it.title + ' ' + it.original_text + ' ' + (it.project||'')).toLowerCase().indexOf(q) >= 0;
  });
}
function listaHTML(arr, vacio){ return arr.length ? arr.map(itemHTML).join('') : '<div class="empty">' + vacio + '</div>'; }

function itemHTML(it){
  var c = cuando(it);
  var meta = [];
  if (it.type !== 'task') meta.push('<span class="type">' + TIPO[it.type] + '</span>');
  if (c) meta.push('<span>' + esc(c) + '</span>');
  if (it.project) meta.push('<span class="proj">' + esc(it.project) + '</span>');
  if (it.priority === 'urgent') meta.push('<span class="hot">Urgente</span>');
  else if (it.priority === 'important') meta.push('<span class="hot" style="color:var(--warm)">Importante</span>');

  var ev = it.type === 'event' || it.type === 'idea' || it.type === 'note';
  return '<div class="item" data-id="' + it.id + '">' +
    '<button class="tick' + (ev ? ' ev' : '') + '" onclick="A.completar(event,\'' + it.id + '\')"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>' +
    '<div class="body" onclick="A.abrir(\'' + it.id + '\')"><div class="ttl">' + esc(it.title) + '</div>' +
    (meta.length ? '<div class="meta">' + meta.join('') + '</div>' : '') + '</div></div>';
}

/* ---------- ficha ---------- */
function abrir(id){
  var it = S.items.filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  var proyectos = {};
  S.items.forEach(function(x){ if (x.project) proyectos[x.project] = 1; });
  ['Costa Rica','EMCA','Salud Pública','Consulta','Residencias','Casa','Personal','Redes sociales'].forEach(function(p){ proyectos[p] = 1; });

  var opts = '<option value="">Sin proyecto</option>';
  Object.keys(proyectos).sort().forEach(function(p){
    opts += '<option value="' + esc(p) + '"' + (p === it.project ? ' selected' : '') + '>' + esc(p) + '</option>';
  });

  var tOpts = '';
  Object.keys(TIPO).forEach(function(k){ tOpts += '<option value="' + k + '"' + (k === it.type ? ' selected' : '') + '>' + TIPO[k] + '</option>'; });

  var pOpts = '';
  [['normal','Normal'],['important','Importante'],['urgent','Urgente']].forEach(function(p){
    pOpts += '<option value="' + p[0] + '"' + (p[0] === it.priority ? ' selected' : '') + '>' + p[1] + '</option>';
  });

  $('sheet').innerHTML =
    '<div class="grab"></div>' +
    '<div class="f"><label>Título</label><textarea id="e_t" rows="2">' + esc(it.title) + '</textarea></div>' +
    '<div class="row"><div class="f"><label>Tipo</label><select id="e_ty">' + tOpts + '</select></div>' +
    '<div class="f"><label>Prioridad</label><select id="e_p">' + pOpts + '</select></div></div>' +
    '<div class="f"><label>Proyecto</label><select id="e_pr">' + opts + '</select></div>' +
    '<div class="row"><div class="f"><label>Fecha</label><input id="e_d" type="date" value="' + (it.when_date || '') + '"></div>' +
    '<div class="f"><label>Hora</label><input id="e_h" type="time" value="' + (it.when_time ? String(it.when_time).slice(0,5) : '') + '"></div></div>' +
    (it.when_label ? '<div class="f"><label>Dijiste</label><div class="orig">“' + esc(it.when_label) + '”</div></div>' : '') +
    '<div class="f"><label>Texto original</label><div class="orig">' + esc(it.original_text) + '</div></div>' +
    '<div class="acts"><button class="btn d" onclick="A.borrar(\'' + it.id + '\')">🗑</button>' +
    '<button class="btn s" onclick="A.cerrar()">Cancelar</button>' +
    '<button class="btn p" onclick="A.guardar(\'' + it.id + '\')">Guardar</button></div>';

  $('sheet').classList.add('on'); $('scrim').classList.add('on');
}
function cerrar(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }

function guardar(id){
  var d = $('e_d').value, h = $('e_h').value;
  var kind = !d ? 'none' : (h ? 'datetime' : 'day');
  var body = {
    title: $('e_t').value.trim(),
    type: $('e_ty').value,
    priority: $('e_p').value,
    project: $('e_pr').value,
    when_date: d,
    when_time: h,
    when_kind: kind
  };
  if (!d) { body.when_label = ''; body.when_end_date = ''; body.when_daypart = ''; }
  api('PATCH', '&id=' + id, body).then(function(){
    cerrar(); return load();
  }).then(function(){ render(); toast('Guardado'); });
}

function completar(e, id){
  e.stopPropagation();
  var el = e.target.closest('.item');
  if (el) { el.classList.add('done'); el.querySelector('.tick').classList.add('on'); }
  api('PATCH', '&id=' + id, { done: 'true' }).then(function(){
    setTimeout(function(){ load().then(render); }, 320);
  });
}

function borrar(id){
  api('DELETE', '&id=' + id).then(function(){
    cerrar(); return load();
  }).then(function(){ render(); toast('Movido a la papelera'); });
}

/* ---------- captura ---------- */
function capturar(txt){
  txt = (txt || '').trim();
  if (!txt) return;
  $('cin').value = '';
  var tz = 'Atlantic/Canary';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch(e){}
  api('POST', '', { text: txt, timezone: tz, source: 'app' }).then(function(r){
    if (r && r.success) { toast(r.speech || 'Guardado'); return load().then(render); }
    toast('No he podido guardarlo');
  }).catch(function(){ toast('Sin conexión'); });
}

/* ---------- voz ---------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, grabando = false;

function micro(){
  if (!SR) {
    // iOS Safari no tiene Web Speech. La vía real es el micrófono del teclado.
    $('cin').focus();
    toast('En iPhone: toca el micrófono 🎤 del teclado y habla. Para manos libres, di “Oye Siri, Asistente”.');
    return;
  }
  if (grabando) { try { rec.stop(); } catch(e){} return; }
  try {
    rec = new SR();
    rec.lang = 'es-ES';
    rec.interimResults = true;
    rec.continuous = false;
    rec.onstart = function(){ grabando = true; $('rb').classList.add('rec'); $('cin').placeholder = 'Escuchando…'; };
    rec.onresult = function(ev){
      var t = '';
      for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      $('cin').value = t;
      if (ev.results[ev.results.length-1].isFinal) { try { rec.stop(); } catch(e){} capturar(t); }
    };
    rec.onerror = function(ev){
      fin();
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('El micrófono está bloqueado. Actívalo en los ajustes del navegador.');
      else if (ev.error === 'no-speech') toast('No he oído nada. Prueba otra vez.');
      else if (ev.error === 'audio-capture') toast('No encuentro ningún micrófono.');
      else if (ev.error === 'network') toast('Sin conexión para transcribir.');
      else if (ev.error !== 'aborted') toast('Error al escuchar: ' + ev.error);
    };
    rec.onend = fin;
    rec.start();
  } catch(e){
    fin();
    $('cin').focus();
    toast('Este navegador no permite dictar. Usa el micrófono del teclado.');
  }
}
function fin(){ grabando = false; $('rb').classList.remove('rec'); $('cin').placeholder = 'Capturar…'; }

/* ---------- eventos ---------- */
$('cin').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); capturar(this.value); this.blur(); } });
$('rb').addEventListener('click', micro);
$('scrim').addEventListener('click', cerrar);
$('nav').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  S.view = b.dataset.v; if (S.view !== 'proj') S.proj = null;
  window.scrollTo(0,0); render();
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load().then(render); });

window.A = {
  abrir: abrir, cerrar: cerrar, guardar: guardar, completar: completar, borrar: borrar,
  ir: function(v){ S.view = v; S.proj = null; render(); },
  abrirProy: function(n){ S.proj = n; S.view = 'proj'; window.scrollTo(0,0); render(); },
  mes: function(d){ var b = S.calM ? new Date(S.calM) : new Date(); b.setDate(1); b.setMonth(b.getMonth() + d); S.calM = b.toISOString(); render(); },
  dia: function(iso){ S.selDay = (S.selDay === iso ? null : iso); render(); }
};

render();
load().then(render);
})();
</script>
</body>
</html>
